<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Schematic echocardiography view with a bounding-box prompt and segmentation masks over the right ventricle">
  <!-- Schematic illustration only. Drawn by hand, contains no patient data. -->
  <defs>
    <clipPath id="sector">
      <path d="M320 18 L72 293 A370 370 0 0 0 568 293 Z"/>
    </clipPath>
    <filter id="speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.55" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.66  0 0 0 0 0.68  0 0 0 0 0.70  0 0 0 1.15 -0.42" in="n"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="depth" cx="50%" cy="5%" r="95%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="#05070a"/>

  <g clip-path="url(#sector)">
    <!-- tissue speckle -->
    <rect width="640" height="400" fill="#1b1e22"/>
    <rect width="640" height="400" filter="url(#speckle)"/>
    <!-- bright walls / septum -->
    <g filter="url(#softer)" fill="#d9dde2" opacity="0.55">
      <path d="M306 70 C300 140 300 230 318 280 L332 280 C320 230 318 140 322 70 Z"/>
      <ellipse cx="320" cy="292" rx="150" ry="14"/>
    </g>
    <g filter="url(#softer)" fill="none" stroke="#cfd4da" opacity="0.35" stroke-width="16">
      <ellipse cx="247" cy="170" rx="58" ry="100" transform="rotate(-14 247 170)"/>
      <ellipse cx="380" cy="165" rx="70" ry="118" transform="rotate(10 380 165)"/>
    </g>
    <!-- chambers (blood pools are dark) -->
    <g filter="url(#soft)" fill="#040506">
      <ellipse cx="247" cy="170" rx="44" ry="88" transform="rotate(-14 247 170)"/>
      <ellipse cx="380" cy="165" rx="56" ry="104" transform="rotate(10 380 165)"/>
      <ellipse cx="252" cy="330" rx="54" ry="40"/>
      <ellipse cx="392" cy="334" rx="64" ry="44"/>
    </g>
    <rect width="640" height="400" fill="url(#depth)"/>
  </g>

  <!-- overlays on the right ventricle -->
  <path d="M268 66 L262 84 C232 96 206 150 204 206 C203 236 214 254 236 258 C264 262 282 248 288 214 C294 170 288 110 274 72 Z"
        fill="#1f9d3a" fill-opacity="0.42" stroke="#2fbf55" stroke-width="2"/>
  <path d="M258 90 C228 104 208 156 208 208 C208 236 220 252 240 254 C266 256 282 240 286 208 C290 166 284 112 258 90 Z"
        fill="#4d8fe0" fill-opacity="0.38"/>
  <path d="M262 84 L250 92 L244 104 L234 114 L226 132 L218 150 L212 172 L206 190 L204 210 L206 230 L214 246 L228 256 L248 262 L268 258 L282 246 L288 226 L292 204 L292 176 L290 150 L284 124 L276 104 Z" fill="none" stroke="#e3d22a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="190" y="72" width="112" height="202" fill="none" stroke="#e0242b" stroke-width="3.5" rx="2"/>

  <!-- depth ticks along the sector edge -->
  <g stroke="#8a9099" stroke-width="2"><line x1="394" y1="100" x2="402" y2="94"/><line x1="432" y1="142" x2="440" y2="135"/><line x1="469" y1="183" x2="477" y2="176"/><line x1="506" y1="224" x2="514" y2="217"/><line x1="543" y1="266" x2="551" y2="258"/></g>

  <text x="628" y="390" fill="#6f7680" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" text-anchor="end">Schematic illustration, not patient data</text>
</svg>
